<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — a tiny cooking game</title>
<meta name="description" content="Sizzle & Serve: a tiny original cooking game. Chop, grill, plate and serve before the tickets run out.">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b2118;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  #wrap {
    width: min(100vw, calc(100vh * 1280 / 720));
    aspect-ratio: 1280 / 720;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
    cursor: pointer;
    background: #c98f5f;
  }
</style>
</head>
<body>
<noscript><p style="color:#fff">Sizzle &amp; Serve needs JavaScript to run.</p></noscript>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script src="src/config.js"></script>
<script src="src/input.js"></script>
<script src="src/audio.js"></script>
<script src="src/world.js"></script>
<script src="src/orders.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
